name: Spec refresh

on:
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published schemas
        run: |
          set -euo pipefail
          base="https://www.fatturapa.gov.it/export/documenti"
          mkdir -p downloaded
          curl --fail --silent --show-error --location "$base/fatturapa/v1.4/Schema_VFPR12_v1.2.3.xsd" --output downloaded/Schema_VFPR12_v1.2.3.xsd
          curl --fail --silent --show-error --location "$base/fatturapa/v1.4/Schema_VFSM10v_1.0.2.xsd" --output downloaded/Schema_VFSM10v_1.0.2.xsd
          curl --fail --silent --show-error --location "$base/messaggi/v1.1/MessaggiTypes_v1.1.xsd" --output downloaded/MessaggiTypes_v1.1.xsd
          curl --fail --silent --show-error --location "https://www.w3.org/TR/2002/REC-xmldsig-core-20020212/xmldsig-core-schema.xsd" --output downloaded/xmldsig-core-schema.xsd
          curl --fail --silent --show-error --location "https://www.agenziaentrate.gov.it/portale/documents/d/guest/allegato-a-specifiche-tecniche-vers-1-9-1" --output "downloaded/Allegato A - Specifiche tecniche vers 1.9.1 31032026.pdf"
      - name: Compare with the vendored copy
        run: |
          set -uo pipefail
          changed=0
          for f in Schema_VFPR12_v1.2.3.xsd Schema_VFSM10v_1.0.2.xsd MessaggiTypes_v1.1.xsd xmldsig-core-schema.xsd "Allegato A - Specifiche tecniche vers 1.9.1 31032026.pdf"; do
            if ! cmp -s "downloaded/$f" "spec/$f"; then
              echo "::error::the published $f differs from the vendored spec/$f"
              changed=1
            fi
          done
          if [ "$changed" -ne 0 ]; then
            echo "::error::a published spec file changed. Update spec/ and, for a schema, regenerate with 'cargo run -p codegen'."
            exit 1
          fi
      - name: Check the format page for a new schema version
        run: |
          set -uo pipefail
          page=$(curl --fail --silent --show-error --location "https://www.fatturapa.gov.it/it/norme-e-regole/documentazione-fattura-elettronica/formato-fatturapa/")
          actual=$(echo "$page" | grep -oiE '[A-Za-z0-9_./-]*\.xsd' | sed 's|.*/||' | sort -u)
          expected=$(printf '%s\n' \
            "Schema_del_file_xml_FatturaPA_v1.2.2.xsd" \
            "Schema_VFPA12_V1.2.3.xsd" \
            "Schema_VFPR12_v1.2.3.xsd" \
            "Schema_VFSM10v_1.0.2.xsd" | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::the format page links schemas outside the known set. A new version is probably published."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
