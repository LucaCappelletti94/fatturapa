[package]
name = "fatturapa"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Reading and writing of every FatturaPA invoice and SDI message"
readme = "README.md"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/fatturapa"
documentation = "https://docs.rs/fatturapa"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
keywords = ["fatturapa", "e-invoicing", "italy", "sdi", "xml"]
categories = ["finance", "parser-implementations"]
# tests/corpus, tests/fixtures/external and tests/external.rs stay in the repository only, under their own licences.
include = [
    "/src",
    "/spec",
    "!/spec/*.pdf",
    "/tests/compile_fail",
    "/tests/document_types.rs",
    "/tests/encoding.rs",
    "/tests/field_tables.rs",
    "/tests/filename.rs",
    "/tests/fixtures",
    "!/tests/fixtures/external",
    "/tests/generator",
    "/tests/invoices.rs",
    "/tests/property.rs",
    "/tests/reader_xpath.rs",
    "/tests/roundtrip.proptest-regressions",
    "/tests/roundtrip.rs",
    "/tests/samples.rs",
    "/tests/serde.rs",
    "/tests/signed.rs",
    "/tests/support",
    "/tests/totals.rs",
    "/tests/truncated.rs",
    "/tests/trust_list.rs",
    "/tests/trybuild.rs",
    "/tests/validate.rs",
    "/README.md",
    "/LICENSE",
]

[dependencies]
base64 = "0.23.1"
cms = { version = "=0.3.0-rc.2", default-features = false }
const-oid = { version = "0.10.3", features = ["db"] }
# Signers write the SignedData in BER, with indefinite lengths and the content split into fragments.
der = { version = "0.8.3", features = ["alloc", "ber", "derive"] }
digest = "0.11.3"
email_address = { version = "0.2.9", default-features = false }
encoding_rs = "0.8.13"
iban_validate = "5.0.1"
iso_country = "0.1.4"
iso_currency = "0.7.1"
jiff = "0.2.39"
quick-xml = { version = "0.42.0", features = ["encoding"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
rustls-pki-types = "1.15"
rustls-webpki = { version = "0.103.16", features = ["ring", "std"] }
serde = { version = "1.0.225", features = ["derive"], optional = true }
sha1 = "0.11.0"
sha2 = { version = "0.11.1", features = ["oid"] }
spki = "0.8.1"
thiserror = "2.0.21"
x509-cert = "0.3.0"
xsd-parser-types = { version = "0.4.0", features = ["quick-xml"] }

[features]
trust-list = []
# Identifiers, amounts and dates serialise through their own string forms, so only the country and currency enums need their crates' serde support.
serde = ["dep:serde", "iso_country/serde", "iso_currency/with-serde"]

[dev-dependencies]
base64 = "0.23.1"
calamine = "0.38.0"
cms = { version = "=0.3.0-rc.2", default-features = false }
const-oid = { version = "0.10.3", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "ber", "derive"] }
digest = "0.11.3"
ecdsa = "0.17.0"
iso_country = "0.1.4"
iso_currency = "0.7.1"
p256 = "0.14.0"
proptest = { version = "1.12.0", features = ["attr-macro"] }
serde_json = "1.0.110"
sha2 = "0.11.1"
spki = "0.8.1"
trybuild = "1.0.122"
# `hazmat` builds the re-tagged issuer names the signer-matching tests compare against.
x509-cert = { version = "0.3.0", features = ["hazmat"] }

[workspace]
members = ["codegen"]

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
missing_docs_in_private_items = "warn"
multiple_crate_versions = "allow"
# Contradicts the unreachable_pub lint enabled above, which asks for pub(crate) where this asks for pub.
redundant_pub_crate = "allow"
unwrap_used = "warn"

[lints]
workspace = true

[profile.mutants]
inherits = "test"
debug = "none"

[package.metadata.docs.rs]
all-features = true
